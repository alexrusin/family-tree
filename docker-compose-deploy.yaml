services:
  app:
    image: ${IMAGE_URI}
    container_name: family-tree-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      APP_VERSION: ${APP_VERSION:-unknown}
      # Set to 1 in .env.production (then restart) to surface auth error logs.
      AUTH_DEBUG_LOGS: ${AUTH_DEBUG_LOGS:-0}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_FROM_EMAIL: ${MAILTRAP_FROM_EMAIL}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${AWS_REGION}
    ports:
      - "${APP_PORT:-3001}:3001"
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/ec2/family-tree-app
        awslogs-region: ${AWS_REGION:-us-west-2}

  postgres:
    image: postgres:18-alpine
    container_name: family-tree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
